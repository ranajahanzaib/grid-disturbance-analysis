name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint and format check with ruff
        run: |
          .venv/bin/ruff check src tests scripts examples
          .venv/bin/ruff format --check src tests scripts examples

      - name: Type check with mypy
        run: |
          .venv/bin/mypy src/grid_disturbance

      - name: Run test suite with pytest
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          .venv/bin/pytest --cov=grid_disturbance --cov-report=xml

      - name: Validate CLI entrypoint
        run: |
          .venv/bin/grid-disturbance --help
          .venv/bin/grid-disturbance data prepare --samples 10
          .venv/bin/grid-disturbance data inspect
