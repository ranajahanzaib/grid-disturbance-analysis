[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-disturbance-analysis"
version = "0.1.0"
description = "Power Grid Disturbance Analysis & Source Localization Engine"
readme = "README.md"
authors = [{ name = "Rana Jahanzaib", email = "work@withrana.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "scikit-learn>=1.3.0",
    "pywavelets>=1.4.0",
    "torch>=2.1.0",
    "torchmetrics>=1.2.0",
    "optuna>=3.4.0",
    "matplotlib>=3.8.0",
    "plotly>=5.17.0",
    "streamlit>=1.28.0",
    "pydantic>=2.4.0",
    "pandera>=0.17.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.88.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
grid-disturbance = "grid_disturbance.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501", "B008", "E402", "N806", "N803", "B007"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["F401", "I001"]
"*.ipynb" = ["F401", "I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
